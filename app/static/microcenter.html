<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Box Hunter · Micro Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0b0d0f;
    --bg-2:      #111418;
    --bg-3:      #181c22;
    --line:      #232932;
    --line-2:    #2e3641;
    --ink:       #e7ebf0;
    --ink-dim:   #8a93a0;
    --ink-faint: #525a66;
    --accent:    #b6ff3c;     /* electric green for big steals */
    --warn:      #ffb547;     /* amber for medium */
    --hot:       #ff5b5b;     /* red, used as headline strikethrough accent */
    --tag:       #5ee6c8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-feature-settings: "ss01", "ss02";
    min-height: 100vh;
    background-image:
      radial-gradient(1200px 600px at 80% -20%, rgba(182,255,60,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(94,230,200,0.05), transparent 60%),
      linear-gradient(transparent 95%, rgba(255,255,255,0.025) 95%),
      linear-gradient(90deg, transparent 95%, rgba(255,255,255,0.025) 95%);
    background-size: auto, auto, 32px 32px, 32px 32px;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Header ────────────────────────────────────── */
  header {
    border-bottom: 1px solid var(--line);
    padding: 22px 28px 14px;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 24px;
    position: sticky; top: 0;
    background: rgba(11,13,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  .home-link {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 8px 14px;
    border: 1px solid var(--line-2);
    border-radius: 2px;
    transition: color 0.12s ease, border-color 0.12s ease;
  }
  .home-link:hover { color: var(--accent); border-color: var(--accent); }
  .brand {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand small {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-top: 4px;
    text-transform: uppercase;
  }
  .stat-bar {
    display: flex; gap: 22px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-bar b { color: var(--ink); font-weight: 700; }

  button.primary {
    font-family: "JetBrains Mono", monospace;
    background: var(--accent);
    color: #0b0d0f;
    border: 0;
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button.primary:hover  { filter: brightness(1.1); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled {
    background: var(--line-2);
    color: var(--ink-faint);
    cursor: not-allowed;
  }

  /* ── Controls strip ────────────────────────────── */
  .controls {
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .group-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.12s ease;
    font-weight: 500;
  }
  .chip:hover { border-color: var(--ink-dim); color: var(--ink); }
  .chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    font-weight: 700;
  }
  .chip .count {
    margin-left: 6px;
    color: var(--ink-faint);
    font-weight: 400;
  }
  .chip.active .count { color: var(--ink-faint); }

  input[type="search"], input[type="number"] {
    font-family: "JetBrains Mono", monospace;
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    color: var(--ink);
    padding: 7px 10px;
    font-size: 12px;
    border-radius: 2px;
    width: 220px;
  }
  input[type="number"] { width: 70px; }
  input:focus { outline: none; border-color: var(--accent); }

  /* ── Table ─────────────────────────────────────── */
  main { padding: 24px 28px 80px; }
  .meta-line {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .meta-line .total { color: var(--accent); font-weight: 700; font-size: 13px; }

  .deals { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }

  .row {
    display: grid;
    grid-template-columns: 70px 1fr 130px 130px 110px 70px;
    gap: 18px;
    align-items: center;
    padding: 14px 18px;
    background: var(--bg-2);
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .row:hover { background: var(--bg-3); }

  .row .img {
    width: 56px; height: 56px;
    background: #fff;
    border-radius: 2px;
    overflow: hidden;
    display: grid; place-items: center;
  }
  .row .img img { width: 100%; height: 100%; object-fit: contain; }
  .row .img .ph {
    color: var(--ink-faint);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
  }

  .row .name {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    letter-spacing: -0.005em;
  }
  .row .meta {
    margin-top: 4px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .row .meta .cond { color: var(--tag); }
  .row .meta .cat  { color: var(--ink-dim); }

  .price {
    font-family: "JetBrains Mono", monospace;
    text-align: right;
  }
  .price .reg {
    font-size: 12px;
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--hot);
  }
  .price .ob {
    font-size: 18px;
    color: var(--ink);
    font-weight: 700;
    margin-top: 2px;
  }
  .save {
    font-family: "JetBrains Mono", monospace;
    text-align: right;
  }
  .save .d {
    font-size: 13px;
    color: var(--ink-dim);
  }
  .save .pct {
    font-size: 18px;
    font-weight: 700;
    margin-top: 2px;
  }
  .save .pct.tier-3 { color: var(--accent); }
  .save .pct.tier-2 { color: var(--warn); }
  .save .pct.tier-1 { color: var(--ink); }

  .arrow {
    font-family: "JetBrains Mono", monospace;
    color: var(--ink-faint);
    font-size: 18px;
    text-align: right;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .row:hover .arrow { transform: translateX(4px); color: var(--accent); }

  /* ── Empty / loading ──────────────────────────── */
  .empty, .loading {
    padding: 80px 20px;
    text-align: center;
    color: var(--ink-dim);
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .empty .big {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--line-2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ───────────────────────────────── */
  @media (max-width: 900px) {
    header { grid-template-columns: 1fr; }
    .stat-bar { order: 3; }
    .row {
      grid-template-columns: 56px 1fr;
      grid-template-areas:
        "img name"
        "img meta"
        "price save"
        "price save";
      column-gap: 14px;
    }
    .row .img { grid-area: img; }
    .row .name-block { grid-area: name; }
    .row .price { grid-area: price; text-align: left; }
    .row .save  { grid-area: save; }
    .row .arrow { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    Open Box Hunter
    <small>microcenter · ny region</small>
  </div>
  <div class="stat-bar" id="statbar">
    <span>store: <b id="stat-store">—</b></span>
    <span>deals: <b id="stat-count">0</b></span>
    <span>updated: <b id="stat-time">never</b></span>
  </div>
  <a class="home-link" href="/">← home</a>
  <button class="primary" id="refresh-btn">↻ refresh</button>
</header>

<section class="controls">
  <div class="group">
    <span class="group-label">store</span>
    <div id="store-tabs" class="group"></div>
  </div>
  <div class="group">
    <span class="group-label">sort</span>
    <button class="chip active" data-sort="discount_pct">% off</button>
    <button class="chip" data-sort="discount_dollars">$ saved</button>
    <button class="chip" data-sort="open_box_price">price ↑</button>
    <button class="chip" data-sort="-open_box_price">price ↓</button>
  </div>
  <div class="group">
    <span class="group-label">min %</span>
    <input type="number" id="min-pct" min="0" max="90" step="5" value="0">
  </div>
  <div class="group">
    <span class="group-label">find</span>
    <input type="search" id="search" placeholder="search by name…">
  </div>
</section>

<section class="controls" style="padding-top: 12px; padding-bottom: 12px;">
  <div class="group">
    <span class="group-label">category</span>
    <div id="cat-chips" class="group"></div>
  </div>
</section>

<main>
  <div class="meta-line">
    <span><span class="total" id="meta-total">0</span> matching deals</span>
    <span id="meta-extra"></span>
  </div>
  <div id="deals" class="deals"></div>
</main>

<script>
  const state = {
    stores: {},
    storeKey: null,
    snapshot: null,        // current store's snapshot
    sort: "discount_pct",  // default — highest % off
    category: "All",
    minPct: 0,
    search: "",
  };

  const $ = (s) => document.querySelector(s);
  const fmt$  = (n) => "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const fmtPct = (n) => n.toFixed(1) + "%";
  const fmtTime = (ts) => {
    if (!ts) return "never";
    const d = new Date(ts * 1000);
    const now = Date.now() / 1000;
    const diff = now - ts;
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff/60) + "m ago";
    if (diff < 86400) return Math.floor(diff/3600) + "h ago";
    return d.toLocaleDateString();
  };

  function tierFor(pct) {
    if (pct >= 30) return "tier-3";
    if (pct >= 15) return "tier-2";
    return "tier-1";
  }

  // ── Load store list ──
  async function loadStores() {
    const r = await fetch("/microcenter/api/stores");
    const d = await r.json();
    state.stores = d.stores;
    state.storeKey = d.default;
    renderStoreTabs();
  }

  function renderStoreTabs() {
    const tabs = $("#store-tabs");
    tabs.innerHTML = "";
    for (const [key, meta] of Object.entries(state.stores)) {
      const b = document.createElement("button");
      b.className = "chip" + (key === state.storeKey ? " active" : "");
      b.textContent = meta.name.split(",")[0];
      b.onclick = () => { state.storeKey = key; renderStoreTabs(); loadDeals(); };
      tabs.appendChild(b);
    }
  }

  // ── Load deals ──
  async function loadDeals() {
    $("#deals").innerHTML = '<div class="loading"><span class="spinner"></span>loading cached deals…</div>';
    const r = await fetch("/microcenter/api/deals?store=" + state.storeKey);
    state.snapshot = await r.json();
    state.category = "All";
    renderCategoryChips();
    render();
  }

  // ── Refresh (live scrape) ──
  async function refresh() {
    const btn = $("#refresh-btn");
    btn.disabled = true;
    const orig = btn.textContent;
    btn.innerHTML = '<span class="spinner" style="border-top-color:#0b0d0f"></span>scraping…';
    $("#deals").innerHTML = '<div class="loading"><span class="spinner"></span>fetching live from micro center… this can take 10–30s</div>';
    try {
      const r = await fetch("/microcenter/api/refresh?store=" + state.storeKey, { method: "POST" });
      state.snapshot = await r.json();
      renderCategoryChips();
      render();
    } catch (e) {
      $("#deals").innerHTML = '<div class="empty"><div class="big">Refresh failed</div>' + (e.message || e) + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  }

  // ── Categories ──
  function renderCategoryChips() {
    const counts = {};
    (state.snapshot?.deals || []).forEach(d => {
      counts[d.category] = (counts[d.category] || 0) + 1;
    });
    const cats = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
    const wrap = $("#cat-chips");
    wrap.innerHTML = "";

    const total = (state.snapshot?.deals || []).length;
    const all = document.createElement("button");
    all.className = "chip" + (state.category === "All" ? " active" : "");
    all.innerHTML = `All <span class="count">${total}</span>`;
    all.onclick = () => { state.category = "All"; renderCategoryChips(); render(); };
    wrap.appendChild(all);

    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "chip" + (state.category === c ? " active" : "");
      b.innerHTML = `${c} <span class="count">${counts[c]}</span>`;
      b.onclick = () => { state.category = c; renderCategoryChips(); render(); };
      wrap.appendChild(b);
    });
  }

  // ── Filter + sort + render ──
  function render() {
    const snap = state.snapshot || { deals: [], fetched_at: null, store_name: "—", error: null };
    $("#stat-store").textContent = snap.store_name || "—";
    $("#stat-time").textContent  = fmtTime(snap.fetched_at);
    $("#stat-count").textContent = (snap.deals || []).length;

    let deals = (snap.deals || []).slice();

    if (state.category !== "All") {
      deals = deals.filter(d => d.category === state.category);
    }
    if (state.minPct > 0) {
      deals = deals.filter(d => d.discount_pct >= state.minPct);
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      deals = deals.filter(d => d.name.toLowerCase().includes(q));
    }

    // Sort key is "field" (descending) or "-field" (reversed).
    // Defaults: discount_pct/$ saved → desc (biggest deals first);
    //           open_box_price       → asc (cheapest first), -open_box_price → desc.
    const reversed   = state.sort.startsWith("-");
    const sortKey    = reversed ? state.sort.slice(1) : state.sort;
    const ascending  = sortKey === "open_box_price" ? !reversed : reversed;
    deals.sort((a, b) => ascending ? a[sortKey] - b[sortKey] : b[sortKey] - a[sortKey]);

    $("#meta-total").textContent = deals.length;

    if (snap.error && (!snap.deals || snap.deals.length === 0)) {
      $("#deals").innerHTML = `
        <div class="empty">
          <div class="big">No data yet</div>
          ${snap.error}<br><br>
          Hit <b>↻ refresh</b> to fetch live.
        </div>`;
      return;
    }

    if (deals.length === 0) {
      $("#deals").innerHTML = `<div class="empty"><div class="big">No matches</div>Try a different category, lower the min %, or clear search.</div>`;
      return;
    }

    const html = deals.map(d => {
      const img = d.image
        ? `<img src="${d.image}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'no img'}))">`
        : `<span class="ph">no img</span>`;
      return `
        <a class="row" href="${d.url}" target="_blank" rel="noopener">
          <span class="img">${img}</span>
          <span class="name-block">
            <div class="name">${escapeHtml(d.name)}</div>
            <div class="meta">
              <span class="cond">${escapeHtml(d.condition)}</span>
              <span class="cat">${escapeHtml(d.category)}</span>
              <span>SKU ${escapeHtml(d.sku)}</span>
            </div>
          </span>
          <span class="price">
            <div class="reg">${fmt$(d.regular_price)}</div>
            <div class="ob">${fmt$(d.open_box_price)}</div>
          </span>
          <span class="save">
            <div class="d">−${fmt$(d.discount_dollars)}</div>
            <div class="pct ${tierFor(d.discount_pct)}">${fmtPct(d.discount_pct)}</div>
          </span>
          <span></span>
          <span class="arrow">→</span>
        </a>`;
    }).join("");
    $("#deals").innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  // ── Wire controls ──
  document.querySelectorAll(".chip[data-sort]").forEach(b => {
    b.onclick = () => {
      state.sort = b.dataset.sort;
      document.querySelectorAll(".chip[data-sort]").forEach(x => x.classList.toggle("active", x === b));
      render();
    };
  });
  $("#min-pct").addEventListener("input", e => { state.minPct = +e.target.value || 0; render(); });
  $("#search").addEventListener("input",  e => { state.search = e.target.value.trim(); render(); });
  $("#refresh-btn").onclick = refresh;

  // ── Boot ──
  (async () => {
    await loadStores();
    await loadDeals();
  })();

  // Auto-refresh the "updated 3m ago" line every 30s
  setInterval(() => {
    if (state.snapshot) $("#stat-time").textContent = fmtTime(state.snapshot.fetched_at);
  }, 30000);
</script>
</body>
</html>
