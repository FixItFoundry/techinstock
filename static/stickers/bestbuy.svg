<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <!-- Iconic Best Buy Yellow Tag Sticker -->
  <defs>
    <filter id="bb-tag-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Yellow Tag Shape -->
  <path d="M22 10 L146 10 C151 10 155 14 155 19 L155 91 C155 96 151 100 146 100 L42 100 C39 100 36 98 34 96 L12 74 C9 71 8 68 8 64 L8 24 C8 16 14 10 22 10 Z" fill="#FFE000" stroke="#000000" stroke-width="2.5" />
  <!-- Tag Hole -->
  <circle cx="24" cy="24" r="5" fill="#000000" />
  <!-- BEST BUY Bold Typography -->
  <g fill="#000000" font-family="'Space Grotesk', 'Arial Black', -apple-system, sans-serif" font-weight="900">
    <text x="36" y="52" font-size="29" letter-spacing="-1">BEST</text>
    <text x="36" y="85" font-size="31" letter-spacing="-1">BUY</text>
  </g>
</svg>