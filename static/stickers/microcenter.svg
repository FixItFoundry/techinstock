<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="280" height="130">
  <defs>
    <linearGradient id="mc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004F9F"/>
      <stop offset="100%" stop-color="#002D62"/>
    </linearGradient>
    <linearGradient id="mc-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E31837"/>
      <stop offset="100%" stop-color="#C00A23"/>
    </linearGradient>
  </defs>
  <!-- Outer Blue Badge with White Stroke -->
  <rect x="4" y="4" width="272" height="122" rx="16" fill="url(#mc-bg)" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Top Red Accent Bar -->
  <path d="M4 24 C4 13 13 4 24 4 L256 4 C267 4 276 13 276 24 L276 34 L4 34 Z" fill="url(#mc-red)"/>
  <text x="140" y="25" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="900" font-size="14" letter-spacing="4" text-anchor="middle">MICRO CENTER</text>
  <!-- Stylized Retro Tech "MICRO CENTER" Wordmark -->
  <g fill="#FFFFFF" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" text-anchor="middle">
    <text x="140" y="76" font-size="36" letter-spacing="2">MICRO</text>
    <text x="140" y="112" font-size="32" letter-spacing="4" fill="#FFE000">CENTER</text>
  </g>
</svg>