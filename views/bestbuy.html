<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>techinstock · Best Buy Open Box Outlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-bestbuy">
<header>
  <div class="brand">
    <img src="/static/bestbuy-logo.svg" alt="Best Buy" class="brand-logo-img bb-logo-img">
    <div class="brand-text">
      <h1>Open Box <em>Deals</em></h1>
      <small>Catalog Discounts · Official API</small>
    </div>
  </div>
  <div class="stat-bar" id="statbar">
    <div class="stat-item"><span class="stat-lbl">Deals</span><b id="stat-count">0</b></div>
    <div class="stat-item"><span class="stat-lbl">Updated</span><b id="stat-time">never</b></div>
    <div class="stat-item"><span class="stat-lbl">API Key</span><b id="stat-key">—</b></div>
  </div>
  <div class="header-actions">
    <a class="home-link" href="/">← Hub</a>
    <button class="primary" id="refresh-btn">↻ Refresh Catalog</button>
  </div>
</header>

<div id="key-warning" class="key-banner" hidden>
  <div class="banner-content">
    <span class="banner-icon">⚠️</span>
    <div>
      <b>Best Buy API key not configured.</b>
      Get a free key at <a href="https://developer.bestbuy.com" target="_blank" rel="noopener">developer.bestbuy.com</a>,
      then add <code>BESTBUY_API_KEY</code> to your environment and refresh.
    </div>
  </div>
</div>

<section class="controls bb-filter-bar">
  <div class="group">
    <span class="group-label">Sort</span>
    <div class="sort-chips-group">
      <button class="chip active" data-sort="discount_pct">% Off</button>
      <button class="chip" data-sort="discount_dollars">$ Saved</button>
      <button class="chip" data-sort="open_box_price">Price: Low → High</button>
      <button class="chip" data-sort="-open_box_price">Price: High → Low</button>
    </div>
  </div>
  <div class="group">
    <span class="group-label">Condition</span>
    <div id="cond-chips" class="group cond-chips-wrap"></div>
  </div>
  <div class="group">
    <span class="group-label">Min %</span>
    <input type="number" id="min-pct" min="0" max="90" step="5" value="0">
  </div>
  <div class="group flex-grow">
    <span class="group-label">Find Product</span>
    <input type="search" id="search" placeholder="Search Apple, TVs, OLED, laptops, audio…">
  </div>
</section>

<section class="controls bb-category-bar">
  <div class="group">
    <span class="group-label">Category</span>
    <div id="cat-chips" class="group cat-chips-wrap"></div>
  </div>
</section>

<main>
  <div class="meta-line">
    <span><span class="total" id="meta-total">0</span> matching open-box deals</span>
    <span id="meta-extra"></span>
  </div>
  <div id="deals" class="deals"></div>
</main>

<script src="/static/bb.js"></script>
</body>
</html>
